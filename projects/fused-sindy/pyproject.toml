[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "nanobind>=2.0.0",
    "nvidia-cuda-nvrtc==13.2.78",
    "nvidia-cuda-runtime==13.2.75",
    "nvidia-nvjitlink==13.2.78",
    "nvidia-nvptxcompiler==13.2.78",
]
build-backend = "scikit_build_core.build"

[project]
name = "fused-sindy"
version = "0.1.0"
description = "CUDA-fused Gram kernels for SINDy-style sparse equation search"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "cuda-core==1.0.1",
    "nvidia-cuda-nvrtc==13.2.78",
    "nvidia-nvjitlink==13.2.78",
]

[project.optional-dependencies]
cu12 = ["cuda-core[cu12]==1.0.1"]
cu13 = ["cuda-core[cu13]==1.0.1"]
torch = ["torch"]
test = ["pytest", "torch"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.args = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DIMPLICIT_SINDY_BUILD_TESTS=OFF",
    "-DIMPLICIT_SINDY_BUILD_SOLVER=ON",
    "-DIMPLICIT_SINDY_SOLVER_USE_NVRTC=ON",
]
wheel.packages = ["python/implicit_sindy", "python/fused_sindy"]
