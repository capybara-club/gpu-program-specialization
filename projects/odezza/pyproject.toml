[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odezza"
version = "0.1.0"
description = "GPU-accelerated execution, scoring, and fitting of ODE systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Chris Durham"}]
dependencies = []

[project.optional-dependencies]
cuda13 = ["cuda-core[cu13]>=1.1,<2", "numpy>=1.26"]
dev = []

[project.scripts]
odezza = "odezza.__main__:main"
odezza-generate = "odezza.generate:main"
odezza-compile = "odezza.compiler:main"
odezza-inspect = "odezza.inspect:main"
odezza-example = "odezza.example:main"
odezza-specialize = "odezza.specialize:main"
odezza-run = "odezza.runner:main"
odezza-lm-generate = "odezza.lm_generate:main"
odezza-lm-inspect = "odezza.lm_inspect:main"
odezza-lm-specialize = "odezza.lm_specialize:main"
odezza-grammar = "odezza.grammar.__main__:main"
odegrammar = "odegrammar.__main__:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
