# Validated with nats-server 2.14.6; revalidate after configuration changes.
# Run from the trial checkout. Only local connections / authenticated SSH tunnels.
server_name: odezza-mac3-trial
listen: "127.0.0.1:4222"
http: "127.0.0.1:8222"
max_payload: 1048576
max_pending: 8388608
jetstream {
    store_dir: "./build/service_trial/nats"
    max_memory_store: 512MB
    max_file_store: 512MB
}
# The application must create MEMORY-backed streams explicitly. store_dir is
# broker metadata, not permission to persist job bodies or AST populations.
